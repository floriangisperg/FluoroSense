[project]
name = "fluorosense"
version = "0.1.0"
description = "Streamlit app for Jasco spectrofluorometer data analysis"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "streamlit==1.57.0",
  "plotly==5.15.0",
  "numpy==2.3.5",
  "pandas==2.3.3",
  "scikit-learn==1.8.0",
  "xlsxwriter==3.0.3",
  "openpyxl==3.1.2",
  "scipy==1.17.1",
]

[tool.hatch.build.targets.wheel]
packages = ["."]


